<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ревізія — Лендинг</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #ffffff;
            position: relative;
        }
        
        /* Контейнер для сайту з Канви */
        .canva-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 112.4451%;
            padding-bottom: 60px; /* Місце знизу для другої кнопки */
            overflow: hidden;
        }
        
        iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
            padding: 0;
            margin: 0;
        }

        /* 1. НЕВИДИМА ЗОНА ПОВЕРХ ВЕЛИКОЇ КНОПКИ З КАНВИ */
        .invisible-clickable-link {
            position: absolute;
            top: 36%; 
            left: 5%;
            width: 90%;
            height: 12%;
            background: transparent;
            z-index: 9999;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 2. НАША НИЖНЯ ДОДАТКОВА РОЖЕВА КНОПКА */
        .floating-pink-button {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #b84a5a; /* Гарний рожево-бордовий колір під тон сайту */
            color: #ffffff;
            padding: 14px 35px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            z-index: 999999;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        
        .floating-pink-button:active {
            background-color: #9c3b49;
        }
    </style>
</head>
<body>

    <div class="canva-wrapper">
        <iframe loading="lazy" src="https://www.canva.com/design/DAHKNT42ryQ/nQ3C670mAmQDlNX5z8Kp2Q/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
        
        <a href="ТВОЄ_ПОСИЛАННЯ_НА_ОПЛАТУ" target="_blank" class="invisible-clickable-link"></a>
    </div>

    <a href="https://secure.wayforpay.com/button/b79bde77d66b7" target="_blank" class="floating-pink-button">Зареєструватись на подію</a>

</body>
</html>
